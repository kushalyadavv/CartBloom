# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ea5916404234f5396ec07877cfcd0724"
name = "CartBloom"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Narrowed from the template's write_products,write_metaobjects,
# write_metaobject_definitions. CartBloom creates no products and no
# metaobjects; over-broad scopes draw reviewer scrutiny and have to be
# justified individually in the submission form.
#
#   write_discounts — create and update the single automatic app discount,
#                     and write the config metafields on its discount node
#   read_products   — populate the gift and collection pickers in the wizard
#
# Deliberately NOT requested: any customer or order scope. Customer tag
# targeting is evaluated inside the function via hasTags, which returns
# booleans, so no customer data is ever read. That keeps CartBloom entirely
# out of Protected Customer Data — see spec §11.
scopes = "write_discounts,read_products"

# Offer config, read by the discount function. Compact-encoded: a verbose
# Growth-plan config measures 16,858 bytes against Shopify's 10,000-byte
# function metafield cap, and an oversized value arrives as a silent null.
[discount.metafields.app.cartbloom-config]
type = "json"
name = "CartBloom offer configuration"
description = "Compact-encoded tier and gift configuration evaluated by the discount function"

  [discount.metafields.app.cartbloom-config.access]
  admin = "merchant_read"

# Runtime values for the input query's $tags and $collectionIds. The query is
# compiled at build time and one function serves every shop, so these cannot be
# literals. Shopify populates the variables from this metafield. Lists are
# capped at 100 elements.
[discount.metafields.app.cartbloom-input-variables]
type = "json"
name = "CartBloom input query variables"
description = "Customer tags and collection IDs referenced by the discount function's input query"

  [discount.metafields.app.cartbloom-input-variables.access]
  admin = "merchant_read"

# The widget's copy of the offers, read by Liquid in the app embed block and
# inlined into the page. This is why the storefront makes zero requests to our
# infrastructure — the single property that keeps free hosting viable at any
# traffic level (spec §4).
#
# Deliberately NOT the compact form the function reads. This payload lives under
# the 128 KB json cap rather than the function's 10,000-byte limit, and it
# carries design tokens, copy, and placement the function has no use for.
# Readability here aids support; the byte budget is not scarce.
#
# storefront access is mandatory — without it Liquid cannot read the value and
# the widget silently renders nothing.
[shop.metafields.app.cartbloom-widget-config]
type = "json"
name = "CartBloom widget configuration"
description = "Offers, design tokens, and placement read by the storefront widget"

  [shop.metafields.app.cartbloom-widget-config.access]
  admin = "merchant_read"
  storefront = "public_read"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance topics. Declared here rather than registered per shop
  # so they cannot be missed on an install. shop/redact genuinely purges D1;
  # the customer topics are honest no-ops because CartBloom stores no PII.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
