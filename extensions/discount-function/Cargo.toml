[package]
name = "discount-function"
version = "1.0.0"
edition = "2021"

[dependencies]
shopify_function = "2.1.0"
serde = { version = "1", features = ["derive"] }

# serde_json is a dev-dependency only. The entitlement core does no JSON
# parsing of its own — the vectors are deserialised by the test harness and the
# Shopify function input arrives already decoded — so keeping it out of the
# Wasm build protects the 256 kB size budget.
[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
